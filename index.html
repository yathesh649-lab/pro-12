<!DOCTYPE html>
<html>
<head>
    <title>Pseudo-Class Selectors Example</title>
    <meta charset="utf-8">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 90%;
            background-color: #f0f8ff;
            margin: 40px;
            color: #333;
        }

        main {
            width: 600px;
            background-color: white;
            padding: 25px;
            border: 2px solid #4682b4;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
        }

        a {
            font-weight: bold;
            text-decoration: none;
        }

        a:link {
            color: #006400;
        }

        a:visited {
            color: #8b008b;
        }

        a:hover,
        a:focus {
            color: #ff4500;
            text-decoration: underline;
        }

        main p:first-child {
            font-weight: bold;
            color: #1e90ff;
        }

        main p:first-child::first-letter {
            font-size: 180%;
            color: red;
        }

        li {
            margin: 10px;
        }

        li:hover {
            background-color: #e6f7ff;
        }
    </style>
</head>

<body>

<main>

    <h1>Technology Seminar</h1>

    <p>
        Welcome to our annual technology seminar event.
    </p>

    <p>
        We have many expert speakers sharing their knowledge about modern technology.
    </p>

    <ul>
        <li><a href="speakers/ai.html">Artificial Intelligence Speaker</a></li>
        <li><a href="speakers/web.html">Web Development Speaker</a></li>
        <li><a href="speakers/cloud.html">Cloud Computing Speaker</a></li>
    </ul>

</main>

</body>
</html>
